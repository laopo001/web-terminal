name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Check release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`);
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm package:vscode
      - name: Pack npm package
        run: npm pack --pack-destination release
      - name: Verify npm trusted publisher
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const { name } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tokenUrl = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          tokenUrl.searchParams.set('audience', 'npm:registry.npmjs.org');
          const oidc = await fetch(tokenUrl, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          assert.equal(oidc.status, 200, 'GitHub OIDC token request failed');
          const { value } = await oidc.json();
          const exchange = await fetch(`https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(name)}`, {
            method: 'POST', headers: { Authorization: `Bearer ${value}` },
          });
          assert.equal(exchange.status, 201, 'npm trusted publisher token exchange failed');
          await exchange.body.cancel();
          console.log('GitHub OIDC 与 npm 可信发布关系验证通过');
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: release-packages
          path: |
            release/*.tgz
            release/*.vsix
          if-no-files-found: error
      - name: Publish to npm using OIDC
        if: github.event_name == 'push'
        run: npm publish ./release/*.tgz --access public
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.tgz release/*.vsix --clobber
          else
            gh release create "$RELEASE_TAG" release/*.tgz release/*.vsix --verify-tag --generate-notes
          fi
